};
const labels={inspections:'Inspections',risks:'Registre des risques',incidents:'Incidents',actions:'Actions correctives',haccp:'HACCP',environment:'Environnement',audits:'Audits',epi:'EPI',documents:'Documents',reports:'Rapports',lessons:'Leçons QHSE',toolbox:'Toolbox Talks',simulations:'Simulations et exercices',trainings:'Formations',awareness:'Sensibilisations'};
const icons={inspections:'☑',risks:'◈',incidents:'⚠',actions:'↗',haccp:'♧',environment:'♻',audits:'◎',epi:'⬡',documents:'▤',reports:'▥',lessons:'▣',toolbox:'☷',simulations:'⛑',trainings:'🎓',awareness:'◉'};
const t=k=>(translations[lang]&&translations[lang][k])||translations.fr[k]||k;
const arAreas={'Cuisine':'المطبخ','Magasin':'المخزن','Production':'الإنتاج','Maintenance':'الصيانة','Salle de restauration':'قاعة المطعم'};
function areaName(v){return lang==='ar'?(arAreas[v]||v):lang==='en'?({'Cuisine':'Kitchen','Magasin':'Warehouse','Production':'Production','Maintenance':'Maintenance','Salle de restauration':'Dining room'}[v]||v):v}
function statusName(v){return lang==='ar'?({'Ouvert':'مفتوح','En cours':'قيد التنفيذ','Clôturé':'مغلق'}[v]||v):lang==='en'?({'Ouvert':'Open','En cours':'In progress','Clôturé':'Closed'}[v]||v):v}
function priorityName(v){return lang==='ar'?({'Faible':'منخفض','Moyen':'متوسط','Élevé':'مرتفع','Critique':'حرج'}[v]||v):lang==='en'?({'Faible':'Low','Moyen':'Medium','Élevé':'High','Critique':'Critical'}[v]||v):v}
function titleFor(p){return p==='dashboard'?t('dashboard'):p==='haccp'?'HACCP':t(p)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusPill(s){let c=s==='Clôturé'?'p-green':s==='En cours'?'p-orange':'p-red';return `<span class="pill ${c}">${esc(statusName(s))}</span>`}
function priorityPill(s){let c=s==='Critique'||s==='Élevé'?'p-red':s==='Moyen'?'p-orange':'p-green';return `<span class="pill ${c}">${esc(priorityName(s))}</span>`}
function metric(icon,cls,label,value,trend){return `<div class="metric"><div class="metrichead"><span>${label}</span><span class="metricicon ${cls}">${icon}</span></div><strong>${value}</strong><div class="trend ${trend?'warn':''}">${trend?'↗':'↗'} ${trend||'+8.4%'} <span style="color:var(--muted)">${t('vsLast')}</span></div></div>`}
function tableRows(items){return items.map(x=>`<tr><td><b>${esc(x.title)}</b><small>#QH-${String(x.id).padStart(4,'0')}</small></td><td>${esc(areaName(x.area))}</td><td>${esc(x.owner)}</td><td>${esc(x.date)}</td><td>${statusPill(x.status)}</td><td>${priorityPill(x.priority)}</td></tr>`).join('')}
function tablePanel(title,items,allLink=false){return `<section class="panel tablepanel"><div class="panelhead"><div><h2>${title}</h2><p>${items.length} ${t('items')}</p></div>${allLink?`<button class="secondary" onclick="go('inspections')">${t('viewAll')}</button>`:''}</div><div class="tablewrap"><table><thead><tr><th>${t('title')}</th><th>${t('area')}</th><th>${t('owner')}</th><th>${t('date')}</th><th>${t('status')}</th><th>${t('priority')}</th></tr></thead><tbody>${tableRows(items)}</tbody></table></div><div class="tablefoot"><span>${t('recent')}</span><span>${t('noServer')}</span></div></section>`}
function renderDashboard(){
const all=Object.values(data).flat(), openInc=data.incidents.filter(x=>x.status!=='Clôturé').length, high=data.risks.filter(x=>x.priority==='Critique'||x.priority==='Élevé').length, overdue=data.actions.filter(x=>x.status!=='Clôturé'&&x.date<'2026-10-28').length;
const recent=[...data.inspections].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
const bars=[42,57,48,72,62,88],months=lang==='ar'?['ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر']:['Mai','Juin','Juil.','Août','Sept.','Oct.'];
return `<div class="welcome"><div><div class="eyebrow">QHSE · PERFORMANCE</div><h1>${t('hello')}</h1><p>${t('subtitle')}</p></div><button class="primary" onclick="openModal('inspections')">${t('newInspection')}</button></div>
<div class="metrics">${metric('⚠','mi-red',t('openIncidents'),openInc,'−12.5%')}${metric('☑','mi-blue',t('inspectionsMonth'),data.inspections.length,'+8.4%')}${metric('◈','mi-orange',t('highRisks'),high,'+2.1%')}${metric('↗','mi-green',t('actionsDue'),overdue,'−5.0%')}</div>
<div class="layout2"><section class="panel"><div class="panelhead"><div><h2>${t('activity')}</h2><p>${t('activitySub')}</p></div><span class="pill p-blue">6 ${lang==='ar'?'أشهر':'mois'}</span></div><div class="panelbody"><div class="chart">${bars.map((v,i)=>`<div class="barwrap"><div class="bar ${i%2?'alt':''}" style="height:${v}%"></div><span class="barlabel">${months[i]}</span></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#1769aa"></i>${lang==='ar'?'التفتيشات':'Inspections'}</span><span><i class="dot" style="background:#10a6a0"></i>${lang==='ar'?'الإجراءات المغلقة':'Actions clôturées'}</span></div></div></section>
<section class="panel"><div class="panelhead"><div><h2>${t('riskPriority')}</h2><p>${t('riskSub')}</p></div><span class="pill p-red">${high} ${lang==='ar'?'عالية':'élevés'}</span></div><div class="panelbody"><div class="risklist">${data.risks.slice(0,4).map(x=>`<div class="riskrow"><i class="riskdot" style="background:${x.priority==='Critique'?'#e45858':x.priority==='Élevé'?'#f59e0b':'#1b9c69'}"></i><div><b>${esc(x.title)}</b><small>${areaName(x.area)} · ${esc(x.date)}</small></div>${priorityPill(x.priority)}</div>`).join('')}</div></div></section></div>
${tablePanel(t('recentInspections'),recent,true)}
<div style="display:flex;align-items:center;justify-content:space-between;margin:27px 0 14px"><div><h2 style="font-size:16px;margin:0">${t('modules')}</h2><p style="font-size:12px;color:var(--muted);margin:6px 0 0">${t('modulesSub')}</p></div></div>
<div class="modules">${['inspections','risks','incidents','actions','haccp','environment','audits','epi','documents','reports','lessons','toolbox','simulations','trainings','awareness'].map(p=>`<button class="module" onclick="${p==='reports' ? "openModal('reports')" : "go('"+p+"')"}"><div class="modicon">${icons[p]||'▣'}</div><b>${p==='haccp'?'HACCP':t(p)}</b><small>${lang==='ar'?'إدارة وتتبع السجلات والإجراءات المتعلقة بهذا المجال.':lang==='en'?'Manage and track records and activities in this area.':'Gérez et suivez les dossiers et activités de ce domaine.'}</small></button>`).join('')}</div>`;
}
function renderList(p){
const all=data[p]||[];let query=document.getElementById('globalSearch')?.value?.toLowerCase()||'';
let items=all.filter(x=>[x.title,x.area,x.owner,x.status,x.priority].join(' ').toLowerCase().includes(query));
let addKey=({inspections:'newInspection',risks:'newRisk',incidents:'newIncident',actions:'newAction',audits:'newAudit',documents:'newDoc',reports:'newReport',lessons:'newLesson',toolbox:'newToolbox',simulations:'newSimulation',trainings:'newTraining',awareness:'newAwareness',haccp:'newHaccp',epi:'newEpi',environment:'newEnvironment'})[p]||'add';
return `<div class="pagehead"><div><h1>${p==='haccp'?'HACCP':t(p)}</h1><p>${t('pageIntro')}</p></div><button class="primary" onclick="openModal('${p}')">＋ ${t(addKey)}</button></div>
<div class="filters" style="margin-bottom:16px"><input id="listSearch" placeholder="${t('searchRecords')}" value="${esc(query)}" oninput="syncListSearch(this.value)"><select id="statusFilter" onchange="filterStatus()"><option value="">${t('allStatuses')}</option><option>Ouvert</option><option>En cours</option><option>Clôturé</option></select><select id="areaFilter" onchange="filterStatus()"><option value="">${t('allAreas')}</option><option>Cuisine</option><option>Magasin</option><option>Production</option><option>Maintenance</option><option>Salle de restauration</option></select></div>
<div id="listPanel">${items.length?tablePanel(titleFor(p),items):`<section class="panel empty">${t('empty')}</section>`}</div>`;
}
function render(){
document.documentElement.lang=lang==='ar'?'ar':'fr';document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('rtl',lang==='ar');document.body.classList.toggle('arabic',lang==='ar');
document.querySelectorAll('[data-i18n]').forEach(el=>{let k=el.dataset.i18n;el.textContent=t(k)});
document.getElementById('langBtn').textContent=lang==='fr'?'عربي':lang==='ar'?'English':'Français';
document.getElementById('globalSearch').placeholder=t('search');
document.getElementById('crumbTitle').textContent=titleFor(page);
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
document.getElementById('content').innerHTML=page==='dashboard'?renderDashboard():renderList(page);
}
function go(p){page=p;document.getElementById('globalSearch').value='';render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function openModal(p){
let key=({inspections:'newInspection',risks:'newRisk',incidents:'newIncident',actions:'newAction',audits:'newAudit',documents:'newDoc',reports:'newReport',lessons:'newLesson',toolbox:'newToolbox',simulations:'newSimulation',trainings:'newTraining',awareness:'newAwareness',haccp:'newHaccp',epi:'newEpi',environment:'newEnvironment'})[p]||'newRecord';
let title=t(key);let isReport=p==='reports';
document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form id="recordForm"><div class="modalbody">
<div class="field full"><label>${t('recordTitle')} *</label><input name="title" required placeholder="${lang==='ar'?'مثال: فحص السلامة والنظافة':'Ex. Contrôle sécurité et hygiène'}"></div>
<div class="field"><label>${t('recordArea')}</label><select name="area"><option>Cuisine</option><option>Magasin</option><option>Production</option><option>Maintenance</option><option>Salle de restauration</option></select></div>
<div class="field"><label>${t('recordOwner')}</label><input name="owner" value="${lang==='ar'?'مسؤول QHSE':'Responsable QHSE'}"></div>
<div class="field"><label>${t('recordStatus')}</label><select name="status"><option>Ouvert</option><option>En cours</option><option>Clôturé</option></select></div>
<div class="field"><label>${t('recordPriority')}</label><select name="priority"><option>Faible</option><option>Moyen</option><option selected>Élevé</option><option>Critique</option></select></div>
<div class="field"><label>${t('date')}</label><input type="date" name="date" value="2026-10-28"></div>
<div class="field full"><label>${t('description')}</label><textarea name="desc" placeholder="${lang==='ar'?'اكتب التفاصيل والملاحظات...':'Détails et observations…'}"></textarea></div>
</div><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">${t('cancel')}</button><button class="primary" type="submit">${t('save')}</button></div></form></div></div>`;
document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),arr=data[p]||(data[p]=[]);arr.unshift({id:Date.now(),title:f.get('title'),area:f.get('area'),owner:f.get('owner'),status:f.get('status'),priority:f.get('priority'),date:f.get('date')||'2026-10-28',desc:f.get('desc')});try{localStorage.setItem('qhseDemoData',JSON.stringify(data))}catch(_){}closeModal();render();toast(t('saved'))};
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function syncListSearch(v){let root=document.getElementById('listPanel');if(!root)return;let p=page;let items=(data[p]||[]).filter(x=>[x.title,x.area,x.owner,x.status,x.priority].join(' ').toLowerCase().includes(v.toLowerCase()));root.innerHTML=items.length?tablePanel(titleFor(p),items):`<section class="panel empty">${t('empty')}</section>`}
function filterStatus(){let v=document.getElementById('listSearch')?.value||'',s=document.getElementById('statusFilter')?.value||'',a=document.getElementById('areaFilter')?.value||'';let items=(data[page]||[]).filter(x=>[x.title,x.area,x.owner,x.status,x.priority].join(' ').toLowerCase().includes(v.toLowerCase())&&(!s||x.status===s)&&(!a||x.area===a));document.getElementById('listPanel').innerHTML=items.length?tablePanel(titleFor(page),items):`<section class="panel empty">${t('empty')}</section>`}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
document.getElementById('langBtn').onclick=()=>{lang=lang==='fr'?'ar':lang==='ar'?'en':'fr';render()};
document.getElementById('globalSearch').addEventListener('input',()=>{if(page!=='dashboard')syncListSearch(document.getElementById('globalSearch').value)});
document.getElementById('helpBtn').onclick=()=>{document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${t('about')}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modalbody" style="display:block;line-height:1.7;font-size:13px">${t('aboutText')}<p style="color:#718096">${t('noServer')}</p></div><div class="modalfoot"><button class="primary" onclick="closeModal()">OK</button></div></div></div>`};
try{const saved=localStorage.getItem('qhseDemoData');if(saved){const d=JSON.parse(saved);Object.keys(d).forEach(k=>{if(Array.isArray(d[k]))data[k]=d[k]})}}catch(_){}
render();
</script></body></html>
